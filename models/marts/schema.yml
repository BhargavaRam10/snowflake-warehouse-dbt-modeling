version: 2

models:
  - name: int_daily_route_activity
    description: One row per route per day; business logic lives here, marts stay thin.
    columns:
      - name: route_id
        tests:
          - not_null
          - relationships:
              to: ref('dim_route')
              field: route_id

  - name: fact_pickups
    description: Fact table — one row per route per day; the source of truth for reporting.
    columns:
      - name: report_date
        tests:
          - not_null
      - name: route_id
        tests:
          - not_null
          - relationships:
              to: ref('dim_route')
              field: route_id
      - name: missed_pickup_rate
        description: missed_pickups / pickup_count, computed in the warehouse.
        tests:
          - not_null

  - name: dim_route
    description: Route dimension (SCD type 1), one row per route_id.
    columns:
      - name: route_id
        tests:
          - unique
          - not_null

  - name: dim_date
    description: Generated date dimension, 2026-01-01 + 730 days.
    columns:
      - name: date
        tests:
          - unique
          - not_null
